.n { fill: #0d1117; font-weight: 700; font-size: 17px; }
.ch { animation: show .01s linear backwards; }
.cur { fill: #1f2328; opacity: 0; animation: type .8s steps(6, end) .35s backwards; }
.name { animation: rise .35s ease-out 1.35s backwards; }
.row { animation: rise .35s ease-out backwards; }
.end { animation: show .01s linear 2.4s backwards; }
.blink { fill: #1f2328; animation: blink 1.1s steps(1, end) 2.4s infinite; }
@keyframes show { from { opacity: 0; } to { opacity: 1; } }
@keyframes type { from { opacity: 1; transform: translateX(0); } to { opacity: 1; transform: translateX(55.2px); } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
