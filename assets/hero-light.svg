<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 310" width="840" height="310" role="img" aria-label="Terminal running whoami: Giang Truong, backend / fullstack engineer in Hanoi">
<style>
text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; fill: #1f2328; }
.t { font-size: 13px; fill: #59636e; }
.p { fill: #1a7f37; font-weight: 700; }
